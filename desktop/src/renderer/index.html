<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      A strict CSP so a compromised renderer has no network reach of its own: no remote script, no
      remote styles, no fetch to anywhere. All API traffic goes through the main process.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"
    />
    <title>MemoryOS Agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
